<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operación 3143 · Código Matequímico</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#eef9ff;background:#081522}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#174e61,#081522 60%);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:22px}header{display:flex;align-items:center;gap:15px;border-bottom:1px solid #346578;padding-bottom:15px}.logo{font-size:36px;background:#163e4d;padding:13px;border-radius:18px}h1{font-size:clamp(23px,5vw,39px);margin:0;color:#8bf0d0}small,.muted{color:#a9c4d1}h2{margin:10px 0}.panel{background:#102b3c;border:1px solid #2b6172;border-radius:22px;padding:23px;margin-top:22px;box-shadow:0 12px 30px #0004}.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mission{padding:18px;border-radius:14px;background:#163d4c;border:1px solid #3b7381;text-align:left;color:white;font-size:17px;cursor:pointer}.mission:disabled{opacity:.4;cursor:not-allowed}.mission strong{display:block;color:#8bf0d0;margin-bottom:7px}button{font:inherit}.btn{background:#8bf0d0;border:0;color:#07343c;border-radius:12px;padding:13px 20px;font-weight:800;cursor:pointer;margin:7px 7px 7px 0}.btn.secondary{background:#244e60;color:#fff}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.choice{min-height:68px;border:2px solid #39798a;background:#19465a;color:white;border-radius:13px;font-size:22px;font-weight:700;cursor:pointer}.choice:disabled{cursor:default}.choice.correct{border-color:#70eab0;background:#175941}.choice.wrong{border-color:#ff8c92;background:#672e40}.bar{height:12px;background:#25495b;border-radius:99px;overflow:hidden}.fill{height:100%;background:#8bf0d0;transition:width .2s}.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:15px 0}.feedback{min-height:50px;font-weight:700;padding-top:10px}.code{font-size:clamp(32px,8vw,60px);letter-spacing:12px;color:#8bf0d0;text-align:center;font-weight:900}.hidden{display:none}.tag{color:#f8dc91}footer{margin:30px 0;color:#a9c4d1;font-size:13px;text-align:center}@media(max-width:520px){.missions,.choices{grid-template-columns:1fr}.wrap{padding:13px}.panel{padding:17px}}</style></head><body><div class="wrap"><header><div class="logo">⚗️</div><div><small>EXPO TÉCNICA 2026 · E.E.T. N.º 3143 · MATEMÁTICA I</small><h1>OPERACIÓN 3143</h1><div class="tag">EL CÓDIGO MATEQUÍMICO</div></div></header><main id="app" aria-live="polite"></main><footer>Articulación primaria–secundaria · Laboratorio matemático digital · No requiere registro</footer></div><script>
const app=document.getElementById('app');let level=0,idx=0,score=0,correct=0,locked=false;const levels=[{icon:'➕',name:'Reactores de enteros',desc:'Controlá la temperatura del reactor.',digit:3,questions:[['El reactor está a −7 °C y sube 12 °C. ¿Cuál es la temperatura final?',['5 °C','−5 °C','19 °C','−19 °C'],0,'−7 + 12 = 5'],['La temperatura baja de 4 °C a −6 °C. ¿Cuántos grados descendió?',['2','10','−2','6'],1,'4 − (−6) = 10 grados de descenso'],['Calculá (−4) × (−3) − 15.',['−27','3','−3','27'],2,'12 − 15 = −3']]},{icon:'🧪',name:'Filtros de divisibilidad',desc:'Seleccioná los códigos válidos de las muestras.',digit:1,questions:[['¿Cuál de estos números es divisible por 3 y por 5?',['42','65','75','82'],2,'75 termina en 5 y 7 + 5 = 12, múltiplo de 3'],['¿Cuál es divisible por 9?',['126','125','134','143'],0,'1 + 2 + 6 = 9'],['¿Cuál es el MCM de 6 y 8?',['12','48','24','14'],2,'Múltiplos comunes: 24, 48…; el menor es 24']]},{icon:'⚖️',name:'Mezclas fraccionarias',desc:'Equilibrá las proporciones de las soluciones.',digit:4,questions:[['¿Qué fracción equivale a 1/2?',['2/3','3/6','2/5','3/8'],1,'3/6 se simplifica a 1/2'],['En un recipiente hay 1/4 L y se agregan 2/4 L. ¿Cuánto hay?',['3/8 L','1/2 L','3/4 L','1/4 L'],2,'1/4 + 2/4 = 3/4'],['¿Cuál es mayor?',['2/3','3/5','Son iguales','No se puede saber'],0,'2/3 = 10/15 y 3/5 = 9/15']]},{icon:'🔐',name:'Clave del laboratorio',desc:'Resolvé las últimas pruebas para desbloquear la salida.',digit:3,questions:[['Calculá 18 ÷ (−3) + 9.',['−15','3','−3','15'],1,'−6 + 9 = 3'],['¿Cuánto es 2³ + √16?',['10','12','20','8'],1,'8 + 4 = 12'],['¿Qué número falta? 3 × □ − 5 = 7',['3','5','4','6'],2,'3 × 4 − 5 = 7']]}];
function renderHome(){app.innerHTML=`<section class="panel"><h2>🔬 Alerta en el laboratorio</h2><p>Un fallo bloqueó el laboratorio de química. Tu misión es superar cuatro pruebas matemáticas, recuperar cuatro dígitos y desbloquear la salida.</p><p class="muted">Cada misión tiene 3 preguntas. Podés equivocarte y aprender de la explicación. Al terminar, recibirás tu resultado.</p><div class="missions">${levels.map((l,i)=>`<button class="mission" ${i>level?'disabled':''} onclick="start(${i})"><strong>${l.icon} Misión ${i+1}</strong>${l.name}<br><small>${i<level?'✓ Completada':i===level?'Disponible':'Bloqueada'}</small></button>`).join('')}</div><div class="status"><span>⭐ Puntos: ${score}</span><span>🔐 Dígitos recuperados: ${level}/4</span></div>${level===4?'<button class="btn" onclick="finish()">Abrir laboratorio</button>':''}</section>`}
function start(i){if(i>level)return;idx=0;correct=0;renderQuestion(i)}function renderQuestion(i){locked=false;let l=levels[i],q=l.questions[idx];app.innerHTML=`<section class="panel"><div class="status"><span>${l.icon} Misión ${i+1} de 4</span><span>Pregunta ${idx+1} de ${l.questions.length}</span><span>⭐ ${score} puntos</span></div><div class="bar"><div class="fill" style="width:${(idx/l.questions.length)*100}%"></div></div><h2>${l.name}</h2><p class="muted">${l.desc}</p><h2>${q[0]}</h2><div class="choices">${q[1].map((a,j)=>`<button class="choice" onclick="answer(${i},${j})">${a}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div id="next"></div></section>`}function answer(i,j){if(locked)return;locked=true;let q=levels[i].questions[idx],ok=j===q[2];if(ok){score+=10;correct++}document.querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===j&&!ok)b.classList.add('wrong')});document.getElementById('feedback').textContent=(ok?'✅ ¡Correcto! ':'💡 Seguimos aprendiendo. ')+q[3];document.getElementById('next').innerHTML=`<button class="btn" onclick="next(${i})">${idx===2?'Completar misión':'Siguiente pregunta'} →</button>`}function next(i){idx++;if(idx<levels[i].questions.length){renderQuestion(i);return}if(i===level)level++;let digit=levels[i].digit;app.innerHTML=`<section class="panel"><h2>🎉 ¡Misión completada!</h2><p>Respuestas correctas: ${correct} de 3.</p><p>Recuperaste el dígito:</p><div class="code">${digit}</div><p>Tu puntuación acumulada es de <strong>${score} puntos</strong>.</p><button class="btn" onclick="${level===4?'finish()':'renderHome()'}">${level===4?'Abrir laboratorio':'Continuar misión'} →</button></section>`}function finish(){app.innerHTML=`<section class="panel" style="text-align:center"><h2>🏆 ¡LABORATORIO DESBLOQUEADO!</h2><p>Completaste las cuatro misiones de Matemática I.</p><p>Código recuperado:</p><div class="code">3143</div><h2>⭐ ${score} / 120 puntos</h2><p>¡Felicitaciones, agente matequímico!</p><button class="btn" onclick="reset()">Nuevo visitante ↻</button></section>`}function reset(){level=0;idx=0;score=0;correct=0;renderHome()}renderHome();
</script></body></html>
